<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Village War — Test Suite</title>
<style>
  body { background: #141c2b; color: #e8e2d0; font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin: 20px; }
  h1 { font-size: 16px; font-family: Inter, system-ui, sans-serif; }
  .pass { color: #4ade80; } .fail { color: #f87171; font-weight: bold; }
  #summary { font-size: 15px; margin: 12px 0; font-weight: bold; }
  iframe { width: 10px; height: 10px; opacity: 0; position: absolute; pointer-events: none; }
</style>
</head>
<body>
<h1>⚔️ Village War — Automated Test Suite</h1>
<div id="summary">Booting game…</div>
<div id="results"></div>
<iframe id="game" src="index.html"></iframe>

<script>
// Unlock the gate for the iframe (same origin) and remember the player's real save
const GATE_KEY = 'vw_gate_ok';
const SAVE_KEY = 'villagewar_save';
const realSave = localStorage.getItem(SAVE_KEY);
const realGate = localStorage.getItem(GATE_KEY);

const results = [];
function report(name, ok, detail) {
  results.push({ name, ok, detail });
  const el = document.createElement('div');
  el.className = ok ? 'pass' : 'fail';
  el.textContent = `${ok ? '✓' : '✗'} ${name}${detail ? ' — ' + detail : ''}`;
  document.getElementById('results').appendChild(el);
}
function t(name, fn) {
  try { fn(); report(name, true); }
  catch (e) { report(name, false, e.message); }
}
function eq(a, b, msg) { if (a !== b) throw new Error(`${msg || 'expected'} ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }
function ok(v, msg) { if (!v) throw new Error(msg || 'expected truthy'); }

window.addEventListener('load', () => setTimeout(run, 2500));

function run() {
  const W = document.getElementById('game').contentWindow;
  if (!W || typeof W.state === 'undefined') {
    // game.js state isn't a window global — reach it via a probe
  }
  const G = W; // functions are global in the frame
  const state = G.state || (G.eval ? G.eval('state') : null);
  if (!state) { document.getElementById('summary').textContent = 'FATAL: could not reach game state'; return; }
  const snapshot = JSON.stringify(state);

  // ---------- core economy ----------
  t('resources initialized and non-negative', () => {
    for (const [k, v] of Object.entries(state.resources)) ok(v >= 0, k + ' negative');
  });
  t('canAfford / spendResources round-trip', () => {
    state.resources.coins = 500;
    ok(G.eval('canAfford({coins: 400})'), 'should afford 400');
    ok(!G.eval('canAfford({coins: 600})'), 'should not afford 600');
    G.eval('spendResources({coins: 100})');
    eq(state.resources.coins, 400, 'coins after spend');
  });
  t('addResources respects storage caps', () => {
    G.eval('updateStorageCaps()');
    const cap = state.maxResources.coins;
    state.resources.coins = cap - 10;
    G.eval('addResources({coins: 9999})');
    eq(state.resources.coins, cap, 'coins capped');
  });
  t('quartermaster talent persists through cap recompute', () => {
    G.eval('ensureExp()');
    state.exp.talents.quartermaster = 2;
    G.eval('updateStorageCaps()');
    const withQM = state.maxResources.coins;
    state.exp.talents.quartermaster = 0;
    G.eval('updateStorageCaps()');
    ok(withQM === Math.round(state.maxResources.coins * 1.1), '+10% at rank 2');
  });
  t('building cost scales with level', () => {
    const c1 = G.eval('getBuildingCost("goldmine", 1).coins');
    const c3 = G.eval('getBuildingCost("goldmine", 3).coins');
    ok(c3 > c1 * 1.5, `lv3 (${c3}) should cost well over lv1 (${c1})`);
  });

  // ---------- veterans & memorial ----------
  t('addSoldier assigns name/kills/raids fields', () => {
    G.eval('ensureSoldiers()');
    const s = G.eval('addSoldier("warrior", "reserve")');
    ok(s.name && s.name.includes(' '), 'has a two-part name');
    eq(s.kills, 0); eq(s.raids, 0);
  });
  t('buildings visibly change as they level up', () => {
    // Every renderer took `level` and none of them used it: a Town Hall looked
    // identical at level 1 and level 10, so the game's main reward loop had no
    // visual payoff. buildingTile now adds a footing, growth and heraldry by tier.
    const types = Object.keys(G.eval('BUILDING_DEFS'));
    const same = [];
    for (const t of types) {
      const lo = G.eval(`buildingTile(4, 4, ${JSON.stringify(t)}, 1, 88)`);
      const hi = G.eval(`buildingTile(4, 4, ${JSON.stringify(t)}, 10, 88)`);
      const strip = v => String(v).replace(/>1</g, '>10<');   // ignore the level badge itself
      if (strip(lo) === strip(hi)) same.push(t);
    }
    if (same.length) throw new Error(same.length + ' identical at lv1 and lv10: ' + same.join(', '));
  });

  t('placement art never emits an invalid colour', () => {
    // A "#59514700" (8-digit, alpha 00) and a "#4a3career" both shipped before;
    // an invalid fill renders as nothing at all, which is silent and easy to miss.
    const svg = G.eval('buildingTile(4, 4, "townhall", 10, 88)');
    const bad = (String(svg).match(/(?:fill|stroke)="#[0-9a-zA-Z]*"/g) || [])
      .filter(m => !/#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})"$/.test(m));
    if (bad.length) throw new Error('invalid colour(s): ' + bad.join(', '));
  });

  t('every highlighted placement tile is actually placeable', () => {
    // Regression: the yellow "place here" highlight was drawn on ALL unoccupied
    // tiles while the clickable hit-zone was only drawn on OWNED ones, so 252 of
    // 276 glowing tiles silently swallowed the tap - the game looked broken to a
    // new player during the tutorial's very first placement step.
    G.eval('placingBuilding = "lumbermill"');
    G.eval('renderGrid()');
    const doc = G.document;
    const highlighted = new Set(
      [...doc.querySelectorAll('#village-grid .placement-tile')].map(e => e.getAttribute('data-pos')));
    const clickable = new Set(
      [...doc.querySelectorAll('#village-grid .tile-hit')].map(e => e.getAttribute('data-pos')));
    const dead = [...highlighted].filter(pos => !clickable.has(pos));
    G.eval('placingBuilding = null');
    G.eval('renderGrid()');
    if (dead.length) throw new Error(dead.length + ' highlighted tiles have no hit-zone');
    if (!highlighted.size) throw new Error('no placement tiles rendered at all');
  });

  t('rank thresholds: 0/1/3/7/15 raids', () => {
    const r = n => G.eval(`rankOf({raids:${n}}).name`);
    eq(r(0), 'Recruit'); eq(r(1), 'Regular'); eq(r(3), 'Veteran'); eq(r(7), 'Elite'); eq(r(15), 'Legend');
  });
  t('veteran stat multiplier caps at +24%', () => {
    eq(G.eval('vetStatMult({raids: 99})'), 1.24);
  });
  t('recordFallen buries soldiers and drops morale', () => {
    G.eval('ensureMorale()');
    state.morale = 70;
    const s = G.eval('addSoldier("warrior", "army")');
    const before = state.memorial.length;
    G.eval(`removeSoldiers([${s.id}], "Test Battle")`);
    eq(state.memorial.length, before + 1, 'memorial grew');
    ok(state.morale < 70, 'morale dropped');
    eq(state.memorial[0].fellTo, 'Test Battle');
  });
  t('funeral costs food and restores morale', () => {
    state.resources.food = 1000;
    state.morale = 50;
    G.eval('holdFuneral()');
    ok(state.resources.food < 1000, 'food spent');
    ok(state.morale > 50, 'morale restored');
  });

  // ---------- battle resolution ----------
  t('overwhelming attacker wins, weak attacker loses', () => {
    ok(G.eval('simulateBattle({warrior: 30}, {warrior: 1}, 0, true).victory'), 'should win');
    ok(!G.eval('simulateBattle({warrior: 1}, {warrior: 40}, 100, true).victory'), 'should lose');
  });
  t('equal-forces stalemate is NOT an automatic win', () => {
    let wins = 0;
    for (let i = 0; i < 12; i++) if (G.eval('simulateBattle({shieldbearer: 50}, {shieldbearer: 50}, 0, true).victory')) wins++;
    ok(wins < 12, 'attacker should not win every mirror stalemate');
  });

  // ---------- quests & gates ----------
  t('coinsSpent quest metric tracks', () => {
    G.eval('ensureQuestState()');
    G.eval('state.quests.list = [{id:"spendK", text:"t", goal:1000, metric:"coinsSpent", reward:{}, claimed:false}]; state.quests.progress = {}');
    state.resources.coins = 5000;
    G.eval('spendResources({coins: 1000})');
    eq(state.quests.progress.spendK, 1000);
  });
  t('feature gates lock by Town Hall level', () => {
    const th = state.buildings.find(b => b.type === 'townhall');
    const real = th.level;
    th.level = 1;
    ok(!G.eval('featureUnlocked("club")'), 'club locked at TH1');
    ok(G.eval('featureUnlocked("raid")'), 'raid open at TH1');
    th.level = 4;
    ok(G.eval('featureUnlocked("club")'), 'club open at TH4');
    th.level = real;
  });
  t('objective advisor returns a sane objective', () => {
    const obj = G.eval('nextObjective()');
    ok(obj === null || (typeof obj.text === 'string' && typeof obj.view === 'string'), 'shape ok');
  });

  // ---------- persistence ----------
  t('save/load round-trip preserves core state', () => {
    G.eval('saveGame()');
    const before = JSON.stringify({ r: state.resources, n: state.soldiers.length, m: state.memorial.length });
    G.eval('loadGame()');
    const after = JSON.stringify({ r: state.resources, n: state.soldiers.length, m: state.memorial.length });
    eq(after, before);
  });

  t('spendResources refuses what the player cannot afford', () => {
    // It used to subtract unconditionally: 10 coins minus a 5000-coin cost left
    // the player on -4990, and a negative balance poisons every comparison after.
    const snap = G.eval('JSON.stringify(state.resources)');
    try {
      G.eval('state.resources.coins = 10');
      const refused = G.eval('spendResources({ coins: 5000 })');
      eq(refused, false, 'unaffordable spend should return false, got');
      eq(G.eval('state.resources.coins'), 10, 'balance must be untouched, got');

      // An affordable spend still goes through and still reports success.
      G.eval('state.resources.coins = 500');
      eq(G.eval('spendResources({ coins: 200 })'), true, 'affordable spend should return true, got');
      eq(G.eval('state.resources.coins'), 300, 'coins after spending 200 of 500');

      // A missing resource key must not produce NaN. A zero-cost entry is the
      // path that reaches the subtraction, since canAfford lets 0 through -
      // `undefined - 0` is NaN, and NaN compares false against every cap and
      // price in the game, so it spreads silently once it lands in a balance.
      G.eval('delete state.resources.gold');
      eq(G.eval('spendResources({ gold: 0 })'), true, 'a zero cost is affordable, got');
      eq(G.eval('state.resources.gold'), 0, 'missing key after a zero-cost spend');

      // An unaffordable spend against a missing key is refused outright, so the
      // key is left exactly as it was rather than written as NaN.
      G.eval('delete state.resources.gold');
      eq(G.eval('spendResources({ gold: 5 })'), false, 'missing key cannot afford 5, got');
      eq(G.eval('typeof state.resources.gold'), 'undefined', 'refused spend wrote to the balance; type is');

      // A malformed cost is refused rather than turning a balance into NaN.
      G.eval('state.resources.iron = 100');
      eq(G.eval('spendResources({ iron: undefined })'), false, 'undefined cost should refuse, got');
      eq(G.eval('spendResources({ iron: NaN })'), false, 'NaN cost should refuse, got');
      eq(G.eval('state.resources.iron'), 100, 'iron after two malformed spends');
    } finally {
      G.eval(`state.resources = JSON.parse(${JSON.stringify(snap)})`);
    }
  });

  t('every cost the game can quote is a real number', () => {
    // spendResources now rejects a malformed cost, so a cost table carrying a
    // stray undefined would silently refuse a purchase the player can afford.
    const bad = G.eval(`(function () {
      const bad = [];
      let checked = 0;
      const check = (label, cost) => {
        if (!cost || typeof cost !== 'object') return;
        checked++;
        for (const [r, amt] of Object.entries(cost)) {
          if (typeof amt !== 'number' || !isFinite(amt) || amt < 0) bad.push(label + '.' + r + '=' + amt);
        }
      };
      Object.keys(BUILDING_DEFS).forEach(t => {
        check('place:' + t, typeof getPlaceCost === 'function' && getPlaceCost(t));
        // Upgrade costs scale per level, so they are the likeliest to go bad.
        for (let lv = 2; lv <= 12; lv++) check('upgrade:' + t + ':' + lv, getBuildingCost(t, lv));
      });
      Object.entries(TROOP_DEFS).forEach(([t, d]) => check('troop:' + t, d.cost));
      Object.entries(HERO_DEFS).forEach(([h, d]) => check('hero:' + h, d.unlockCost));
      Object.entries(RESEARCH_NODES).forEach(([k, d]) => check('research:' + k, d.cost));
      // Guard against this test quietly checking nothing if a table is renamed.
      if (checked < 150) bad.push('only ' + checked + ' costs examined');
      return bad.join(', ');
    })()`);
    eq(bad, '', 'malformed costs');
  });

  t('a starting village has no ring of road around the hall', () => {
    // The hall's paving was laid unconditionally, and from orthogonal neighbours
    // only - on a 2x2 hall that is a hollow 8-tile outline. A brand new village,
    // whose only building IS the hall, opened onto a closed loop of road
    // circling it and joining nothing.
    const snap = G.eval('JSON.stringify(state.buildings)');
    try {
      G.eval("state.buildings = state.buildings.filter(b => b.type === 'townhall')");
      eq(G.eval('state.buildings.length'), 1, 'test setup: buildings');
      eq(G.eval('computeRoads().size'), 0, 'roads around a lone Town Hall');

      // Once a village grows, paving appears - and fills its corners, so it
      // reads as a square rather than as an outline drawn around the hall.
      // Tiles are taken from the owned set rather than from fixed offsets, which
      // are not all guaranteed to be free.
      const added = G.eval(`(function(){
        const taken = new Set();
        state.buildings.forEach(b => buildingFootprint(b.type, b.pos).forEach(f => taken.add(f)));
        const free = [...getOwnedTiles()].filter(p => !taken.has(p));
        const need = PLAZA_MIN_BUILDINGS - state.buildings.length + 1;
        free.slice(0, Math.max(0, need)).forEach(p => state.buildings.push({ type:'farm', pos:p, level:1, hp:100 }));
        return state.buildings.length;
      })()`);
      ok(added >= G.eval('PLAZA_MIN_BUILDINGS'), 'test setup: grown village has ' + added + ' buildings');
      ok(G.eval('computeRoads().size') > 0, 'a grown village should have paving');
    } finally {
      G.eval(`state.buildings = JSON.parse(${JSON.stringify(snap)})`);
    }
  });

  t('cloud save is not starved by the autosave loop', () => {
    // saveGame() runs about every 2s. queueCloudSave debounced by 4s and cleared
    // the pending timer on every call, so the timer never survived long enough
    // to fire: 5 saves in 10s produced 0 POSTs to /api/save. The max-wait is
    // what makes a sync eventually happen at all.
    // VWNet and VW_SAVE_MAX_WAIT are top-level consts, so they are NOT window
    // properties - reach them through eval in the frame, as with BUILDING_DEFS.
    const net = G.eval('VWNet');
    const maxWait = G.eval('VW_SAVE_MAX_WAIT');
    const prev = { online: net.online, token: net.token, pending: net._savePending };
    const realNow = G.cloudSaveNow;
    let fired = 0;
    try {
      net.online = true; net.token = 'test-token';
      G.cloudSaveNow = function () { fired++; net._savePending = 0; };

      net._savePending = 0;
      G.queueCloudSave();
      eq(fired, 0, 'first call should defer, not fire; fired');

      // Simulate the autosave loop having kept it deferred past the max wait.
      net._savePending = Date.now() - (maxWait + 1000);
      G.queueCloudSave();
      eq(fired, 1, 'a save pending past the max wait must go through; fired');

      // Signed out, nothing should ever be sent.
      net.token = null; net._savePending = 0;
      G.queueCloudSave();
      eq(fired, 1, 'signed out must not sync; fired');
    } finally {
      G.cloudSaveNow = realNow;
      net.online = prev.online; net.token = prev.token; net._savePending = prev.pending;
      clearTimeout(net._saveTimer);
    }
  });

  t('an unsaved player always has a route to saving progress', () => {
    // The top-bar chip is hidden below 481px (the bar has ~30px spare at 375px),
    // and More - which holds Account & Saves - is gated behind Town Hall 3. So a
    // new player on a phone who pressed "Skip for now" had no way to an account
    // at all: the button the skip toast points at did not exist for them yet.
    ok(G.eval('FEATURE_GATES.more') > 1, 'More is gated, which is what the phone button exists for');

    const net = G.eval('VWNet');
    const prevPlayer = net.player;
    const prevBackup = G.eval('localStorage.getItem("vw_last_backup_at")');
    try {
      net.player = null;
      G.eval('localStorage.removeItem("vw_last_backup_at")');
      G.updateAccountChip();
      const fab = G.document.getElementById('save-progress-fab');
      ok(fab, 'the phone save-progress button should exist in the DOM');
      ok(fab.classList.contains('show'), 'unsaved progress should offer the button');
      ok(!fab.classList.contains('hidden'), 'unsaved progress should not hide the button');

      // Once progress is safe it goes away and does not come back.
      G.eval('vwMarkBackedUp()');
      ok(!fab.classList.contains('show'), 'a backed-up player should not be nagged');
      ok(fab.classList.contains('hidden'), 'the button should be hidden once progress is safe');
    } finally {
      net.player = prevPlayer;
      G.eval(prevBackup == null
        ? 'localStorage.removeItem("vw_last_backup_at")'
        : `localStorage.setItem("vw_last_backup_at", ${JSON.stringify(prevBackup)})`);
      G.updateAccountChip();
    }
  });

  t('a backup code round-trips and refuses junk', () => {
    const code = G.eval('vwBackupCode()');
    ok(code && code.length > 50, 'backup code looks empty');
    const back = JSON.parse(decodeURIComponent(escape(atob(code))));
    eq(back.buildings.length, G.eval('state.buildings.length'), 'buildings in the backup');
    eq(JSON.stringify(back.resources), G.eval('JSON.stringify(state.resources)'), 'resources in the backup');

    // Restoring is the one path that overwrites a player's village, so a code
    // that is damaged or simply not ours must be refused before it is written.
    const saveBefore = G.eval('localStorage.getItem("villagewar_save")');
    const attempt = v => G.eval(`(function(){
      document.body.insertAdjacentHTML('beforeend',
        '<div id="tmp-restore"><textarea id="vw-restore-code"></textarea><div id="vw-restore-err"></div></div>');
      document.getElementById('vw-restore-code').value = ${JSON.stringify(v)};
      vwRestoreSubmit();
      const e = document.getElementById('vw-restore-err').textContent;
      document.getElementById('tmp-restore').remove();
      return e;
    })()`);
    ok(attempt(''), 'an empty code should be refused');
    ok(attempt('not a code at all !!'), 'a malformed code should be refused');
    ok(attempt(btoa('{"not":"a village"}')), 'valid base64 with no village should be refused');
    eq(G.eval('localStorage.getItem("villagewar_save")'), saveBefore, 'a refused restore must not touch the save');
  });

  // Runs LAST on purpose: it calls loadGame(), which REPLACES the shared `state`
  // this suite runs against. Sitting mid-file it broke the four tests after it.
  t('a corrupt save never bricks the game', () => {
    // A save is untrusted input - truncated by an interrupted write, left over
    // from an older build, or hand-edited. loadGame used to spread it blindly
    // over the defaults, so `"buildings": "nope"` replaced the array with a
    // string and the next state.buildings.find() threw: an unplayable game with
    // no recovery the player could discover.
    // The suite shares one live `state`, and loadGame() REPLACES it - restoring
    // only localStorage left the following tests running against a state they
    // had not set up, and four of them failed. Snapshot the object itself.
    const snapshot = G.eval('JSON.stringify(state)');
    const real = G.eval('localStorage.getItem("villagewar_save")');
    const cases = {
      garbage:     'not json {{{',
      wrongShape:  '{"buildings":"nope","resources":null,"soldiers":3}',
      emptyObject: '{}',
      badBuilding: '{"buildings":[null,{"type":"farm","pos":"x"},{"type":"farm","pos":60,"level":1,"hp":10}]}',
      badResource: '{"resources":{"coins":-500,"wood":null}}',
      unknownType:  '{"buildings":[{"type":"zeppelinpad","level":2,"pos":211,"hp":100}]}',
      unknownTroop: '{"soldiers":[{"id":1,"type":"dragonrider","assignment":"army"}]}'
    };
    const broken = [];
    for (const [name, payload] of Object.entries(cases)) {
      try {
        G.eval(`localStorage.setItem("villagewar_save", ${JSON.stringify(payload)})`);
        G.eval('loadGame()');
        // the exact operations that used to throw
        G.eval('state.buildings.find(b => b && b.type === "farm")');
        G.eval('(() => { let n = 0; for (const s of state.soldiers) n++; return n; })()');
        // The production tick runs continuously and did NOT guard its
        // BUILDING_DEFS lookup, so an unknown type froze the economy on every
        // frame. Load and render alone did not catch it.
        G.eval('state.buildings.forEach(b => { const d = BUILDING_DEFS[b.type]; if (!d) throw new Error("undefined building def survived load: " + b.type); })');
        G.eval('state.soldiers.forEach(s => { const d = TROOP_DEFS[s.type]; if (!d) throw new Error("undefined troop def survived load: " + s.type); })');
        const ok = G.eval('["coins","gold","iron","wood","food"].every(k => typeof state.resources[k] === "number" && isFinite(state.resources[k]) && state.resources[k] >= 0)');
        if (!ok) broken.push(name + ' (resource not a usable number)');
      } catch (e) {
        broken.push(name + ' -> ' + e.message);
      }
    }
    G.eval(real ? `localStorage.setItem("villagewar_save", ${JSON.stringify(real)})` : 'localStorage.removeItem("villagewar_save")');
    G.eval(`Object.keys(state).forEach(k => delete state[k]); Object.assign(state, ${snapshot});`);
    if (broken.length) throw new Error(broken.join('; '));
  });


  // restore the player's real save so tests never clobber progress
  try {
    if (realSave != null) localStorage.setItem(SAVE_KEY, realSave); else localStorage.removeItem(SAVE_KEY);
    if (realGate != null) localStorage.setItem(GATE_KEY, realGate);
  } catch (e) {}

  const passed = results.filter(r => r.ok).length;
  const failed = results.length - passed;
  document.getElementById('summary').innerHTML =
    `<span class="${failed ? 'fail' : 'pass'}">${passed}/${results.length} passed${failed ? ' · ' + failed + ' FAILED' : ' ✓'}</span>`;
  window.__testResults = { passed, failed, results };
}
</script>
</body>
</html>
